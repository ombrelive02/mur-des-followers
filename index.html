
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMBRE_LIVE - Mur des Followers</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090909;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 45px 15px;
      background: linear-gradient(135deg, #130000, #7b0000, #160000);
      border-bottom: 3px solid #ff3030;
    }
    h1 {
      color: #ff3333;
      font-size: clamp(28px, 6vw, 50px);
      margin: 15px 0;
    }
    .subtitle { color: #ffc7c7; }
    .count {
      font-size: 24px;
      margin: 30px 0;
      color: #ff5555;
    }
    .wall {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }
    .follower {
      background: #1c1010;
      border: 1px solid #9b2525;
      border-radius: 12px;
      padding: 18px 8px;
      overflow-wrap: anywhere;
    }
    footer {
      padding: 35px 15px;
      color: #aaa;
    }
    a { color: #ff5555; }
  </style>
</head>
<body>
  <header>
    <h1>🏆 LE MUR DES FOLLOWERS 🏆</h1>
    <h2>😈 OMBRE_LIVE 😈</h2>
    <p class="subtitle">❤️ MERCI POUR VOTRE SOUTIEN ! ❤️</p>
  </header>

  <div class="count" id="count"></div>
  <main class="wall" id="wall"></main>

  <footer>
    💜 Chaque follower fait partie de l'aventure !
    <p>
      <a href="https://www.twitch.tv/ombrelive02">
        Retrouve-moi sur Twitch
      </a>
    </p>
  </footer>

  <script>
    async function afficherFollowers() {
      const compteur = document.getElementById("count");
      const mur = document.getElementById("wall");

      try {
        const reponse = await fetch("followers.json?version=" + Date.now(), {
          cache: "no-store"
        });
        if (!reponse.ok) {
          throw new Error("Impossible de charger followers.json");
        }

        const abonnes = await reponse.json();
        if (!Array.isArray(abonnes)) {
          throw new Error("Format des followers invalide");
        }

        compteur.textContent = "❤️ " + abonnes.length + " followers affichés";
        mur.replaceChildren();

        abonnes.forEach(nom => {
          const carte = document.createElement("div");
          carte.className = "follower";
          carte.textContent = "❤️ " + nom;
          mur.appendChild(carte);
        });
      } catch (erreur) {
        compteur.textContent = "⚠️ Impossible de charger les followers";
        console.error("Chargement des followers :", erreur);
      }
    }

    afficherFollowers();
  </script>
</body>
</html>
