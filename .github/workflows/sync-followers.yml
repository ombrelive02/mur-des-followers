name: Synchronisation followers Twitch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: twitch-followers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le chiffrement
        run: python -m pip install cryptography

      - name: Synchroniser les followers
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_BROADCASTER_ID: ${{ secrets.TWITCH_BROADCASTER_ID }}
          TWITCH_TOKEN_KEY: ${{ secrets.TWITCH_TOKEN_KEY }}
        run: python sync_followers.py

      - name: Sauvegarder les mises a jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add followers.json twitch_tokens.enc
          if ! git diff --cached --quiet; then
            git commit -m "Mise a jour des followers Twitch"
            git push
          fi
          
